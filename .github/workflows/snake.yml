name: Gerar estatísticas e snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Gerar cards de estatísticas
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          AUTO_PUSH: false
          THEME: github_dark
          ANIMATION: load
          DURATION: 3

      - name: Preparar cards para publicação
        shell: bash
        run: |
          mkdir -p dist
          cp profile-summary-card-output/github_dark/3-stats.svg dist/github-stats.svg
          cp profile-summary-card-output/github_dark/1-repos-per-language.svg dist/top-languages.svg
          cp profile-summary-card-output/github_dark/0-profile-details.svg dist/profile-details.svg

      - name: Gerar SVGs da snake em verde-musgo
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#556B2F&color_dots=#EBF1E6,#C5D5B9,#8FBC8F,#6B8E23,#3F571F
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8FBC8F&color_dots=#11170D,#24301C,#3F571F,#6B8E23,#A9C98E

      - name: Publicar SVGs no branch output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
