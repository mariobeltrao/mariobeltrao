name: Gerar cards, estatísticas e snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar dados de contribuição
        env:
          # CARDS_TOKEN (PAT opcional) inclui contribuições privadas; sem ele, só as públicas
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt
          python scripts/cards.py fetch

      - name: Renderizar e commitar os cards
        run: |
          python scripts/cards.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then echo "Cards já atualizados"; exit 0; fi
          git commit -m "chore: atualizar cards do perfil [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Gerar cards de estatísticas
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          AUTO_PUSH: false
          THEME: github_dark
          ANIMATION: load
          DURATION: 3

      - name: Preparar cards para publicação
        shell: bash
        run: |
          mkdir -p dist
          cp profile-summary-card-output/github_dark/3-stats.svg dist/github-stats.svg
          cp profile-summary-card-output/github_dark/1-repos-per-language.svg dist/top-languages.svg
          cp profile-summary-card-output/github_dark/0-profile-details.svg dist/profile-details.svg

      - name: Gerar SVGs da snake em verde-musgo
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#556B2F&color_dots=#EBF1E6,#C5D5B9,#8FBC8F,#6B8E23,#3F571F
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8FBC8F&color_dots=#11170D,#24301C,#3F571F,#6B8E23,#A9C98E

      - name: Publicar SVGs no branch output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
