<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-label="Terminal com código Python sobre engenharia de IA">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .prompt { fill: #6B8E23; }
    .code { fill: #F4F7F0; }
    .str { fill: #B5D99C; }
    .kw { fill: #8FBC8F; font-weight: 700; }
    .dim { fill: #7C8A70; }
    .cursor { fill: #8FBC8F; animation: piscar 1s steps(1) infinite; }
    @keyframes piscar { 50% { opacity: 0; } }
  </style>

  <!-- janela -->
  <rect x="1" y="1" width="358" height="238" rx="14" fill="#11170D" stroke="#2F3E24" stroke-width="2"/>
  <path d="M1 15 A14 14 0 0 1 15 1 H345 A14 14 0 0 1 359 15 V34 H1 Z" fill="#1A2414"/>
  <circle cx="22" cy="18" r="5" fill="#6B8E23"/>
  <circle cx="40" cy="18" r="5" fill="#556B2F"/>
  <circle cx="58" cy="18" r="5" fill="#2F3E24"/>
  <text x="180" y="22" text-anchor="middle" class="mono dim" font-size="11">mario@ai-lab: ~</text>

  <!-- código -->
  <text class="mono" x="18" y="62"><tspan class="prompt">$ </tspan><tspan class="code">python trilha_ia.py</tspan></text>
  <text class="mono" x="18" y="90"><tspan class="kw">from</tspan><tspan class="code"> ia </tspan><tspan class="kw">import</tspan><tspan class="code"> llm, rag, agentes</tspan></text>
  <text class="mono" x="18" y="118"><tspan class="code">mario = Dev(</tspan><tspan class="str">"Mário"</tspan><tspan class="code">)</tspan></text>
