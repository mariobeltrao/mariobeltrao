  <text class="mono" x="18" y="174"><tspan class="code">mario.construir(</tspan><tspan class="str">"projetos reais"</tspan><tspan class="code">)</tspan></text>
  <text class="mono" x="18" y="210"><tspan class="prompt">✔ </tspan><tspan class="dim">evoluindo todos os dias</tspan></text>
  <rect class="cursor" x="222" y="199" width="8" height="15"/>
