<svg xmlns="http://www.w3.org/2000/svg" width="290" height="150" viewBox="0 0 290 150" role="img" aria-label="Certificados: 8 cursos · IA e Python"><title>Certificados: 8 cursos · IA e Python</title><style>@font-face{font-family:M;font-weight:400;src:url(data:font/woff;base64,) format("woff")}@font-face{font-family:Q;font-weight:700;src:url(data:font/woff;base64,) format("woff")}.m4{font-family:M,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:400}.q7{font-family:Q,Quicksand,ui-rounded,system-ui,sans-serif;font-weight:700}
.a{animation-duration:.8s;animation-timing-function:cubic-bezier(.2,.75,.25,1);animation-fill-mode:both}
